name: Prod UI render check

# Render the DEPLOYED web page in a real headless browser and report the computed
# styles (proves the CSS actually applies, not just that the file returns 200).
# Opt-in via a [pcheck] commit marker or manual dispatch.

on:
  workflow_dispatch:
  push:
    branches: [claude/loquia-milestone-1-frontend-rnoc96]

concurrency:
  group: render-uicheck
  cancel-in-progress: true

jobs:
  uicheck:
    name: Headless render of prod
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pcheck]') }}
    env:
      WEB_URL: https://loquia-web.onrender.com
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium
      - name: Render and inspect computed styles
        run: |
          cat > check.cjs <<'EOF'
          (async () => {
            const { chromium } = require('playwright');
            const b = await chromium.launch();
            const p = await b.newPage();
            const cssFailed = [], consoleErr = [];
            p.on('response', r => { if (r.url().includes('/_next/static/css/') && r.status()!==200) cssFailed.push(r.status()+' '+r.url()); });
            p.on('console', m => { if (m.type()==='error') consoleErr.push(m.text().slice(0,160)); });
            const url = process.env.WEB_URL + '/pt-BR';
            const resp = await p.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            const info = await p.evaluate(() => ({
              sheets: document.styleSheets.length,
              cssRules: [...document.styleSheets].reduce((n,s)=>{try{return n+s.cssRules.length}catch{return n}},0),
              stylesheetLinks: document.querySelectorAll('link[rel=stylesheet]').length,
              bodyBg: getComputedStyle(document.body).backgroundColor,
              bodyColor: getComputedStyle(document.body).color,
            }));
            console.log('HTTP', resp && resp.status());
            console.log(JSON.stringify({ ...info, cssFailed, consoleErr: consoleErr.slice(0,8) }, null, 2));
            await b.close();
            // Styled iff the canvas token is applied to the body background.
            if (info.bodyBg === 'rgb(247, 245, 241)' && info.cssRules > 50) { console.log('UI STYLED: PASS'); }
            else { console.log('::error::UI appears UNSTYLED (bodyBg='+info.bodyBg+', cssRules='+info.cssRules+')'); process.exit(1); }
          })().catch(e => { console.error(e.message); process.exit(1); });
          EOF
          node check.cjs
