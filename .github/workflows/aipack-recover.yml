name: AI Pack live test

# Definitive test: wait for a stable loquia-api, create a SMALL fresh text
# meeting (1 chunk, fast), and poll ITS AI Pack to a definitive ready/failed,
# printing the exact job errorCode/errorMessage (reveals a bad model or an
# invalid Anthropic request param). Opt-in: dispatch or [aipackfix]. No secrets.

on:
  workflow_dispatch:
  push:
    branches: [claude/loquia-milestone-1-frontend-rnoc96]

concurrency:
  group: aipack-recover
  cancel-in-progress: false

jobs:
  test:
    name: Create small meeting + poll AI Pack
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[aipackfix]') }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      API_HOST: https://api.loquia.com.br
      WWW: https://www.loquia.com.br
      EMAIL: vinicius@apymine.com
      PW: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Wait for a fully-settled, stable loquia-api
        run: |
          set -uo pipefail
          RENDER_API_KEY="$(printf '%s' "$RENDER_API_KEY" | tr -d '[:space:]')"
          API="https://api.render.com/v1"
          auth=(-H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json")
          svc="$(curl -fsS -m 30 "${auth[@]}" "${API}/services?limit=100" || echo '[]')"
          api_id="$(jq -r '.[].service|select(.name=="loquia-api")|.id' <<<"$svc" | head -n1)"
          stable=0
          for i in $(seq 1 60); do
            st="$(curl -fsS -m 30 "${auth[@]}" "${API}/services/${api_id}/deploys?limit=1" | jq -r '.[0].deploy.status')"
            echo "  deploy: ${st} (poll ${i}, stable=${stable})"
            if [ "$st" = "live" ]; then stable=$((stable+1)); else stable=0; fi
            [ "$stable" -ge 2 ] && break
            case "$st" in build_failed|update_failed|canceled) echo "::warning::${st}"; break;; esac
            sleep 15
          done
          for k in 1 2 3 4 5; do c="$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "${API_HOST}/health" || echo 000)"; echo "  health -> $c"; [ "$c" = "200" ] && break; sleep 5; done
          sleep 15

      - name: Create small text meeting + poll to ready/failed
        run: |
          set -uo pipefail
          PW="${PW:-password123}"
          jar="$(mktemp)"
          lc="$(curl -sS -m 60 -c "$jar" -o /dev/null -w '%{http_code}' -X POST "${API_HOST}/api/auth/login" \
            -H 'content-type: application/json' -H "Origin: ${WWW}" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PW}\"}" || echo 000)"
          echo "login=${lc}"; [ "$lc" = "200" ] || { echo "::error::login failed"; exit 1; }

          echo "== Create text meeting (Plaud-style, speaker-labeled) =="
          # Block form: timestamp / Speaker N / utterance — exercises speaker parsing.
          TX=$'00:00:00\nSpeaker 1\nBom dia a todos. Vamos comecar a reuniao comercial. O Paulo vai abrir.\n\n00:00:12\nSpeaker 2\nObrigado. Estou abrindo a reuniao como acionista e conselho. O objetivo hoje e decidir o preco do plano Pro e alinhar o cronograma.\n\n00:00:35\nSpeaker 1\nProponho R$ 99 por mes, com base na pesquisa com 40 clientes.\n\n00:00:52\nSpeaker 2\nConcordo com R$ 99. Vamos oferecer tambem um plano anual com 2 meses gratis e revisar os numeros em 30 dias.\n\n00:01:20\nSpeaker 1\nFicou decidido entao: lancar o Pro a R$ 99 por mes, plano anual com 2 meses gratis, e eu preparo a pagina de precos ate sexta.'
          body="$(jq -n --arg t "AIPack livetest" --arg l "pt-BR" --arg x "$TX" '{title:$t,meetingLanguage:$l,text:$x}')"
          cc="$(curl -sS -m 60 -b "$jar" -o /tmp/c -w '%{http_code}' -X POST "${API_HOST}/api/meetings/process-text" \
            -H 'content-type: application/json' -H "Origin: ${WWW}" -d "$body" || echo 000)"
          echo "  create=${cc}  $(head -c 160 /tmp/c)"
          MID="$(jq -r '.meetingId // empty' /tmp/c 2>/dev/null)"
          [ -n "$MID" ] || { echo "::error::create failed"; exit 1; }
          echo "  meetingId=${MID}"

          echo "== Poll aiPackStatus (up to ~5 min) =="
          final=""
          for i in $(seq 1 20); do
            code="$(curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" -o /tmp/m -w '%{http_code}' "${API_HOST}/api/meetings/${MID}" || echo 000)"
            st="$(jq -r '.aiPackStatus // "?"' /tmp/m 2>/dev/null || echo '?')"
            echo "  poll ${i}: http=${code} aiPackStatus=${st}"
            case "$st" in ready|failed) final="$st"; break;; esac
            sleep 15
          done

          echo "== Latest job (error detail) =="
          curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/job" -o /tmp/job || true
          jq '{type,status,progress,errorCode,errorMessage,provider,model}' /tmp/job 2>/dev/null || head -c 400 /tmp/job

          echo "== Meeting speakers (attribution check) =="
          jq '{participantCount, speakerAliases}' /tmp/m 2>/dev/null || true

          echo "== Generated AI Pack CONTENT (quality check) =="
          curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/aipack" -o /tmp/pack || true
          # Show section keys + fact count + classification, and each fact's text.
          jq -r '(.source.sections // []) | if length==0 then "  <no sections>" else .[] | "  [\(.key)] facts=\((.facts//[])|length)\n" + ((.facts//[])|map("     - (\(.classification)) \(.text)  ev=\((.segmentIds//[])|join(","))")|join("\n")) end' /tmp/pack 2>/dev/null || { echo "  raw:"; head -c 800 /tmp/pack; }

          case "$final" in
            ready) echo "RESULT: AI Pack generation WORKS in production. Inspect the CONTENT above for coherence." ;;
            failed) echo "::error::RESULT: AI Pack FAILED — errorCode/errorMessage above pinpoints the fix." ;;
            *) echo "::warning::RESULT: still generating after 5 min for a tiny input — the generation path is stuck; see the job above." ;;
          esac

          echo "== Cleanup: delete ALL 'AIPack livetest' meetings (keep the account tidy) =="
          curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings?includeArchived=true" -o /tmp/all || true
          for DID in $(jq -r '.[] | select(.title=="AIPack livetest") | .id' /tmp/all 2>/dev/null); do
            dc="$(curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" -o /dev/null -w '%{http_code}' -X DELETE "${API_HOST}/api/meetings/${DID}" || echo 000)"
            echo "  deleted ${DID} -> ${dc}"
          done
