name: AI Pack live test

# Definitive test: wait for a stable loquia-api, create a SMALL fresh text
# meeting (1 chunk, fast), and poll ITS AI Pack to a definitive ready/failed,
# printing the exact job errorCode/errorMessage (reveals a bad model or an
# invalid Anthropic request param). Opt-in: dispatch or [aipackfix]. No secrets.

on:
  workflow_dispatch:
  push:
    branches: [claude/loquia-milestone-1-frontend-rnoc96]

concurrency:
  group: aipack-recover
  cancel-in-progress: false

jobs:
  test:
    name: Create small meeting + poll AI Pack
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[aipackfix]') }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      API_HOST: https://api.loquia.com.br
      WWW: https://www.loquia.com.br
      EMAIL: vinicius@apymine.com
      PW: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Wait for THIS COMMIT to be live on loquia-api
        run: |
          set -uo pipefail
          RENDER_API_KEY="$(printf '%s' "$RENDER_API_KEY" | tr -d '[:space:]')"
          API="https://api.render.com/v1"
          auth=(-H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json")
          svc="$(curl -fsS -m 30 "${auth[@]}" "${API}/services?limit=100" || echo '[]')"
          api_id="$(jq -r '.[].service|select(.name=="loquia-api")|.id' <<<"$svc" | head -n1)"
          SHA="${GITHUB_SHA}"
          echo "  waiting for deploy of commit ${SHA} on ${api_id}"
          live=0
          for i in $(seq 1 80); do
            d="$(curl -fsS -m 30 "${auth[@]}" "${API}/services/${api_id}/deploys?limit=20" || echo '[]')"
            st="$(jq -r --arg s "$SHA" '.[] | select(.deploy.commit.id==$s) | .deploy.status' <<<"$d" | head -n1)"
            if [ -z "$st" ] || [ "$st" = "null" ]; then echo "  our deploy not created yet (poll ${i})"; sleep 15; continue; fi
            echo "  our commit deploy: ${st} (poll ${i})"
            case "$st" in
              live) live=1; break;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed) echo "::error::deploy ${st} for ${SHA}"; exit 1;;
            esac
            sleep 15
          done
          [ "$live" = "1" ] || { echo "::error::commit ${SHA} never went live"; exit 1; }
          # Settle + health.
          sleep 20
          for k in 1 2 3 4 5; do c="$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "${API_HOST}/health" || echo 000)"; echo "  health -> $c"; [ "$c" = "200" ] && break; sleep 5; done
          sleep 10

      - name: Check loquia-web deploy (the RTF fix ships here)
        run: |
          set -uo pipefail
          RENDER_API_KEY="$(printf '%s' "$RENDER_API_KEY" | tr -d '[:space:]')"
          API="https://api.render.com/v1"
          auth=(-H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json")
          svc="$(curl -fsS -m 30 "${auth[@]}" "${API}/services?limit=100" || echo '[]')"
          web_id="$(jq -r '.[].service|select(.name=="loquia-web")|.id' <<<"$svc" | head -n1)"
          echo "  loquia-web=${web_id}"
          curl -fsS -m 30 "${auth[@]}" "${API}/services/${web_id}/deploys?limit=3" \
            | jq -r '.[] | "  web deploy: status=\(.deploy.status) commit=\(.deploy.commit.id[0:8]) at=\(.deploy.finishedAt // .deploy.createdAt)"' || true

      - name: Create LONG multi-speaker meeting (forces chunking) + poll
        run: |
          set -uo pipefail
          PW="${PW:-password123}"
          jar="$(mktemp)"
          lc="$(curl -sS -m 60 -c "$jar" -o /dev/null -w '%{http_code}' -X POST "${API_HOST}/api/auth/login" \
            -H 'content-type: application/json' -H "Origin: ${WWW}" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PW}\"}" || echo 000)"
          echo "login=${lc}"; [ "$lc" = "200" ] || { echo "::error::login failed"; exit 1; }

          echo "== Build a LONG synthetic transcript (~90 turns, 4 speakers) =="
          : > /tmp/tx.txt
          topics=("o preco do plano Pro" "o cronograma de lancamento" "a meta de churn abaixo de 4%" "o gateway de pagamento" "a pagina de precos" "a pesquisa com 40 clientes" "o plano anual com 2 meses gratis" "o orcamento de R$ 120 mil" "a contratacao de marketing" "a revisao em 30 dias" "o risco da concorrencia" "a integracao com o CRM")
          decis=("Ficou decidido lancar a R$ 99 por mes." "Ficou decidido revisar os numeros em 30 dias." "Ficou decidido que o Paulo prepara a pagina de precos ate sexta." "Ficou decidido oferecer 2 meses gratis no plano anual.")
          t=0
          for n in $(seq 0 89); do
            sp=$(( (n % 4) + 1 ))
            mm=$(printf '%02d' $(( t / 60 ))); ss=$(printf '%02d' $(( t % 60 )))
            tp="${topics[$(( n % ${#topics[@]} ))]}"
            printf '00:%s:%s\nSpeaker %d\n' "$mm" "$ss" "$sp" >> /tmp/tx.txt
            if [ $(( n % 7 )) -eq 6 ]; then
              printf '%s Isso e um ponto importante para %s.\n\n' "${decis[$(( n % ${#decis[@]} ))]}" "$tp" >> /tmp/tx.txt
            else
              printf 'Sobre %s, eu acho que precisamos alinhar melhor e trazer numeros concretos antes de decidir. O que voces acham?\n\n' "$tp" >> /tmp/tx.txt
            fi
            t=$(( t + 18 ))
          done
          echo "  transcript chars=$(wc -c </tmp/tx.txt) lines=$(wc -l </tmp/tx.txt)"

          body="$(jq -n --arg t "AIPack livetest" --arg l "pt-BR" --rawfile x /tmp/tx.txt '{title:$t,meetingLanguage:$l,text:$x}')"
          cc="$(curl -sS -m 60 -b "$jar" -o /tmp/c -w '%{http_code}' -X POST "${API_HOST}/api/meetings/process-text" \
            -H 'content-type: application/json' -H "Origin: ${WWW}" -d "$body" || echo 000)"
          echo "  create=${cc}  $(head -c 160 /tmp/c)"
          MID="$(jq -r '.meetingId // empty' /tmp/c 2>/dev/null)"
          [ -n "$MID" ] || { echo "::error::create failed"; exit 1; }
          echo "  meetingId=${MID}"

          echo "== Poll aiPackStatus (up to ~10 min for a long transcript) =="
          started=$(date +%s); final=""
          for i in $(seq 1 40); do
            code="$(curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" -o /tmp/m -w '%{http_code}' "${API_HOST}/api/meetings/${MID}" || echo 000)"
            st="$(jq -r '.aiPackStatus // "?"' /tmp/m 2>/dev/null || echo '?')"
            echo "  poll ${i} (+$(( $(date +%s) - started ))s): http=${code} aiPackStatus=${st}"
            case "$st" in ready|failed) final="$st"; break;; esac
            sleep 15
          done
          echo "  elapsed=$(( $(date +%s) - started ))s"

          echo "== Latest job (error detail) =="
          curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/job" -o /tmp/job || true
          jq '{type,status,progress,errorCode,errorMessage,provider,model}' /tmp/job 2>/dev/null || head -c 400 /tmp/job

          echo "== Meeting speakers (attribution check) =="
          jq '{participantCount, speakerAliases}' /tmp/m 2>/dev/null || true

          echo "== Generated AI Pack CONTENT (quality check) =="
          curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/aipack" -o /tmp/pack || true
          # Section -> line counts (persisted content lives in `.lines`).
          jq -r '(.source.sections // []) | if length==0 then "  <no sections>" else (map("  [\(.key)] lines=\((.lines//[])|length)")|join("\n")) end' /tmp/pack 2>/dev/null || { echo "  raw:"; head -c 800 /tmp/pack; }
          echo "  -- EXECUTIVE SUMMARY (the intelligence) --"
          jq -r '[(.source.sections//[])[] | select(.key=="summary") | (.lines//[])[] | (.text // .pt // .en)] | map("     "+.)|join("\n")' /tmp/pack 2>/dev/null || true
          echo "  -- sample actions / risks / decisions (LP sections) --"
          jq -r '[(.source.sections//[])[] | select(.key=="actionItems") | (.lines//[])[] | (.text // .pt // .en)] | .[0:3] | map("     action: "+.)|join("\n")' /tmp/pack 2>/dev/null || true
          jq -r '[(.source.sections//[])[] | select(.key=="risks") | (.lines//[])[] | (.text // .pt // .en)] | .[0:3] | map("     risk: "+.)|join("\n")' /tmp/pack 2>/dev/null || true
          jq -r '[(.source.sections//[])[] | select(.key=="explicitDecisions") | (.lines//[])[] | (.text // .pt // .en)] | .[0:3] | map("     dec: "+.)|join("\n")' /tmp/pack 2>/dev/null || true
          echo "  -- sample quote (grounding evidence next to a synthesized item) --"
          jq -r '[(.source.sections//[])[] | (.lines//[])[] | select(.quote) | .quote] | .[0:2] | map("     quote: "+.)|join("\n")' /tmp/pack 2>/dev/null || true

          case "$final" in
            ready) echo "RESULT: LONG-transcript AI Pack generation WORKS in production." ;;
            failed) echo "::error::RESULT: AI Pack FAILED on a long transcript — see errorCode/errorMessage above." ;;
            *) echo "::warning::RESULT: still generating after ~10 min — long-transcript path is too slow or stuck; see the job above." ;;
          esac

          echo "== Cleanup: delete ALL 'AIPack livetest' meetings (keep the account tidy) =="
          curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings?includeArchived=true" -o /tmp/all || true
          for DID in $(jq -r '.[] | select(.title=="AIPack livetest") | .id' /tmp/all 2>/dev/null); do
            dc="$(curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" -o /dev/null -w '%{http_code}' -X DELETE "${API_HOST}/api/meetings/${DID}" || echo 000)"
            echo "  deleted ${DID} -> ${dc}"
          done
