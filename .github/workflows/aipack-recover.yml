name: Recover stuck AI Pack

# The stuck meeting's ai_pack job was orphaned at status=running by repeated API
# redeploys (each push redeploys loquia-api, killing generate() mid-flight). The
# runner self-heals stale running jobs after 5 min, but the churn kept resetting
# it. This waits for the API deploy triggered by THIS push to settle, then
# regenerates the AI Pack (always a fresh job) and polls until ready/failed —
# proving generate() completes with the configured model/key. Opt-in: dispatch
# or [aipackfix]. Never prints secrets.

on:
  workflow_dispatch:
  push:
    branches: [claude/loquia-milestone-1-frontend-rnoc96]

concurrency:
  group: aipack-recover
  cancel-in-progress: false

jobs:
  recover:
    name: Regenerate + poll to ready
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[aipackfix]') }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      API_HOST: https://api.loquia.com.br
      WWW: https://www.loquia.com.br
      EMAIL: vinicius@apymine.com
      PW: ${{ secrets.ADMIN_PASSWORD }}
      MEETING_ID: e96932fa-55ba-4440-9cd1-afb105aa503f
    steps:
      - name: Wait for loquia-api deploy to settle
        run: |
          set -uo pipefail
          RENDER_API_KEY="$(printf '%s' "$RENDER_API_KEY" | tr -d '[:space:]')"
          API="https://api.render.com/v1"
          auth=(-H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json")
          svc="$(curl -fsS -m 30 "${auth[@]}" "${API}/services?limit=100" || echo '[]')"
          api_id="$(jq -r '.[].service|select(.name=="loquia-api")|.id' <<<"$svc" | head -n1)"
          for i in $(seq 1 40); do
            st="$(curl -fsS -m 30 "${auth[@]}" "${API}/services/${api_id}/deploys?limit=1" | jq -r '.[0].deploy.status')"
            echo "  loquia-api deploy: ${st} (poll ${i})"
            case "$st" in live) break;; build_failed|update_failed|canceled) echo "::warning::${st}"; break;; esac
            sleep 15
          done
          # A little extra settle time so the runner has booted.
          sleep 10

      - name: Regenerate AI Pack + poll until ready
        run: |
          set -uo pipefail
          PW="${PW:-password123}"
          jar="$(mktemp)"
          lc="$(curl -sS -m 60 -c "$jar" -o /dev/null -w '%{http_code}' -X POST "${API_HOST}/api/auth/login" \
            -H 'content-type: application/json' -H "Origin: ${WWW}" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PW}\"}" || echo 000)"
          echo "login=${lc}"; [ "$lc" = "200" ] || { echo "::error::login failed"; exit 1; }

          echo "== POST regenerate =="
          rc="$(curl -sS -m 60 -b "$jar" -o /tmp/r -w '%{http_code}' -X POST "${API_HOST}/api/meetings/${MEETING_ID}/ai-pack/regenerate" -H "Origin: ${WWW}" || echo 000)"
          echo "  regenerate=${rc}  $(head -c 160 /tmp/r)"

          echo "== Poll aiPackStatus (up to ~4 min) =="
          final=""
          for i in $(seq 1 16); do
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MEETING_ID}" -o /tmp/m || true
            st="$(jq -r '.aiPackStatus' /tmp/m 2>/dev/null || echo '?')"
            echo "  poll ${i}: aiPackStatus=${st}"
            case "$st" in ready|failed) final="$st"; break;; esac
            sleep 15
          done

          echo "== Latest job =="
          curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MEETING_ID}/job" -o /tmp/job || true
          jq '{type,status,progress,errorCode,errorMessage,provider,model}' /tmp/job 2>/dev/null || head -c 300 /tmp/job

          case "$final" in
            ready) echo "VERDICT: AI Pack generated successfully — the meeting is fixed." ;;
            failed) echo "::error::VERDICT: AI Pack FAILED — see errorCode/errorMessage above (likely model/provider)." ;;
            *) echo "::warning::VERDICT: still generating after the poll window — it should finish shortly now that the instance is stable." ;;
          esac
