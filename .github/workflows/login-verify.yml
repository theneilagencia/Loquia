name: Live login verify

# Drive a REAL headless browser through the deployed web login and assert it
# lands in the app — the definitive check that the cross-site session cookie is
# stored and sent. The push that carries the API fix auto-deploys loquia-api, so
# this does NOT trigger a deploy itself; it waits for /health, then retries the
# browser login while the rollout finishes. Opt-in: manual dispatch or a
# [logincheck] commit marker. Never prints secrets.

on:
  workflow_dispatch:
  push:
    branches: [claude/loquia-milestone-1-frontend-rnoc96]

concurrency:
  group: login-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Browser login against deployed web
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[logincheck]') }}
    env:
      WEB_URL: https://loquia-web.onrender.com
      API_URL: https://loquia-api.onrender.com
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Wait for API to answer (cold start + rollout)
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            code="$(curl -sS -o /dev/null -m 60 -w '%{http_code}' "${API_URL}/health" || echo 000)"
            echo "  api /health -> ${code} (attempt ${i})"
            [ "$code" = "200" ] && break
            sleep 15
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium
      - name: Browser login (with retries while the API rollout finishes)
        run: |
          cat > login.cjs <<'EOF'
          (async () => {
            const { chromium } = require('playwright');
            const WEB = (process.env.WEB_URL || '').replace(/\/$/, '');
            const email = process.env.ADMIN_EMAIL || 'vinicius@apymine.com';
            const password = process.env.ADMIN_PASSWORD || 'password123';

            async function attempt(n) {
              const b = await chromium.launch();
              const ctx = await b.newContext();
              const p = await ctx.newPage();
              let loginStatus = 'none', setCookie = '';
              p.on('response', async r => {
                if (r.url().includes('/api/auth/login')) {
                  loginStatus = r.status();
                  const h = await r.allHeaders();
                  setCookie = h['set-cookie'] || '';
                }
              });
              await p.goto(`${WEB}/pt-BR/login`, { waitUntil: 'networkidle', timeout: 60000 });
              await p.getByLabel('E-mail').fill(email);
              await p.getByLabel('Senha').fill(password);
              await p.getByRole('button', { name: 'Entrar' }).click();
              await p.waitForTimeout(5000);
              const url = p.url();
              // A stored cross-site cookie means a reload stays authenticated (no bounce to /login).
              await p.goto(`${WEB}/pt-BR/app`, { waitUntil: 'networkidle', timeout: 60000 });
              await p.waitForTimeout(2500);
              const afterReload = p.url();
              console.log(`attempt ${n}: loginStatus=${loginStatus} sameSite=${/samesite=none/i.test(setCookie)?'None':(setCookie?'other':'n/a')} urlAfterLogin=${url} urlAfterReload=${afterReload}`);
              await p.screenshot({ path: 'after-login.png', fullPage: true });
              await b.close();
              const ok = /\/pt-BR\/app(\b|\/|\?|$)/.test(afterReload) && !/\/login/.test(afterReload);
              return ok;
            }

            for (let n = 1; n <= 6; n++) {
              try { if (await attempt(n)) { console.log('LOGIN OK: authenticated and stayed in /app'); process.exit(0); } }
              catch (e) { console.log(`attempt ${n} error: ${e.message}`); }
              await new Promise(r => setTimeout(r, 20000));
            }
            console.log('::error::Login never reached an authenticated /app after 6 attempts');
            process.exit(1);
          })().catch(e => { console.error(e.message); process.exit(1); });
          EOF
          node login.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: after-login-screenshot
          path: after-login.png
          if-no-files-found: ignore
