name: Diagnose AI Pack state

# Read-only production diagnosis. Logs in as the account owner, lists ALL of
# their meetings, and for each prints source/status/aiPackStatus plus the latest
# processing job (type/status/stage/errorCode/errorMessage). This reveals exactly
# which meetings are stuck and on which path (audio vs text; media_processing vs
# ai_pack). Never prints secrets. Opt-in: dispatch or [aipack].

on:
  workflow_dispatch:
  push:
    branches: [claude/loquia-milestone-1-frontend-rnoc96]

concurrency:
  group: aipack-diagnose
  cancel-in-progress: false

jobs:
  diag:
    name: Enumerate meetings + AI Pack state
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[aipack]') }}
    env:
      API_HOST: https://api.loquia.com.br
      WWW: https://www.loquia.com.br
      EMAIL: vinicius@apymine.com
      PW: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Wait for a healthy API
        run: |
          set -uo pipefail
          for k in $(seq 1 40); do
            c="$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "${API_HOST}/health" || echo 000)"
            echo "  health -> $c (try $k)"
            [ "$c" = "200" ] && break
            sleep 10
          done

      - name: List meetings + per-meeting AI Pack state
        run: |
          set -uo pipefail
          PW="${PW:-password123}"
          jar="$(mktemp)"
          lc="$(curl -sS -m 60 -c "$jar" -o /dev/null -w '%{http_code}' -X POST "${API_HOST}/api/auth/login" \
            -H 'content-type: application/json' -H "Origin: ${WWW}" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PW}\"}" || echo 000)"
          echo "login=${lc}"; [ "$lc" = "200" ] || { echo "::error::login failed"; exit 1; }

          echo "== GET /api/meetings (including archived) =="
          curl -sS -m 60 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings?includeArchived=true" -o /tmp/list || true
          n="$(jq 'length' /tmp/list 2>/dev/null || echo '?')"
          echo "  meetings=${n}"
          echo "  ---- summary ----"
          jq -r '.[] | "\(.id)\t\(.source)\t\(.status)\tai=\(.aiPackStatus)\t\(.title)"' /tmp/list 2>/dev/null || head -c 400 /tmp/list

          echo ""
          echo "== Per-meeting latest job (id / source / status / aiPackStatus -> job) =="
          for MID in $(jq -r '.[].id' /tmp/list 2>/dev/null); do
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}" -o /tmp/m || true
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/job" -o /tmp/job || true
            src="$(jq -r '.source' /tmp/m 2>/dev/null)"
            st="$(jq -r '.status' /tmp/m 2>/dev/null)"
            ai="$(jq -r '.aiPackStatus' /tmp/m 2>/dev/null)"
            job="$(jq -c '{type,status,stage,progress,attempt,errorCode,errorMessage,provider,model}' /tmp/job 2>/dev/null || echo 'null')"
            echo "  ${MID}  src=${src} status=${st} ai=${ai}"
            echo "      job=${job}"
          done
