name: Diagnose AI Pack state

# Read-only production diagnosis of the account owner's REAL meetings: source,
# status, aiPackStatus, the transcript's speaker distribution + segment count,
# the CURRENT pack's section/line content, and how many ai_pack jobs exist in the
# last hour (regeneration-limit proximity). Reveals whether a meeting's pack is
# empty vs coherent, and whether its transcript lost speaker attribution (old
# single-speaker ingest) — which regeneration alone cannot fix. Never prints
# secrets. Opt-in: [aipack].

on:
  workflow_dispatch:
  push:
    branches: [claude/loquia-milestone-1-frontend-rnoc96]

concurrency:
  group: aipack-diagnose
  cancel-in-progress: false

jobs:
  diag:
    name: Inspect real meetings
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[aipack]') }}
    env:
      API_HOST: https://api.loquia.com.br
      WWW: https://www.loquia.com.br
      EMAIL: vinicius@apymine.com
      PW: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Wait for a healthy API
        run: |
          set -uo pipefail
          for k in $(seq 1 40); do
            c="$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "${API_HOST}/health" || echo 000)"
            echo "  health -> $c (try $k)"; [ "$c" = "200" ] && break; sleep 10
          done

      - name: Inspect meetings, transcripts and packs
        run: |
          set -uo pipefail
          PW="${PW:-password123}"
          jar="$(mktemp)"
          lc="$(curl -sS -m 60 -c "$jar" -o /dev/null -w '%{http_code}' -X POST "${API_HOST}/api/auth/login" \
            -H 'content-type: application/json' -H "Origin: ${WWW}" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PW}\"}" || echo 000)"
          echo "login=${lc}"; [ "$lc" = "200" ] || { echo "::error::login failed"; exit 1; }

          curl -sS -m 60 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings?includeArchived=true" -o /tmp/list || true
          echo "== meetings: $(jq 'length' /tmp/list 2>/dev/null) =="
          jq -r '.[] | "\(.id)\t\(.source)\t\(.status)\tai=\(.aiPackStatus)\tp=\(.participantCount)\t\(.title)"' /tmp/list 2>/dev/null || head -c 400 /tmp/list

          for MID in $(jq -r '.[].id' /tmp/list 2>/dev/null); do
            echo ""
            echo "==================== meeting ${MID} ===================="
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}" -o /tmp/m || true
            jq '{title,source,status,aiPackStatus,participantCount,durationSeconds}' /tmp/m 2>/dev/null

            echo "-- transcript speakers + segment count --"
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/transcript" -o /tmp/t || true
            jq -r '"  speakers=\((.speakers//[])|length): " + ((.speakers//[])|map(.diarizationLabel + (if .displayName then " ("+.displayName+")" else "" end))|join(", ")) + "\n  segments=\((.segments//[])|length)  distinctSpeakerKeys=\([(.segments//[])[].speakerId]|unique|length)"' /tmp/t 2>/dev/null || echo "  (no transcript)"

            echo "-- current AI Pack (section -> line count) --"
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/aipack" -o /tmp/p || true
            jq -r '(.source.sections // []) | if length==0 then "  <no pack>" else (map("  [\(.key)] lines=\((.lines//[])|length)")|join("\n")) end' /tmp/p 2>/dev/null || echo "  (no pack)"
            echo "  sample lines:"
            jq -r '[(.source.sections//[])[] | select(.key|test("purpose|explicitDecisions|numbersAndDates")) | (.lines//[])[] | (.text // .pt // .en)] | .[0:4] | map("     - "+.)|join("\n")' /tmp/p 2>/dev/null || true

            echo "-- ai_pack job DTO --"
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/ai-pack/status" -o /tmp/s || true
            jq '{status,hasCurrent,version,provider,model,generatedAt}' /tmp/s 2>/dev/null || true
          done
