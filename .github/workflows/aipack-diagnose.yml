name: Diagnose AI Pack state

# Read-only production diagnosis. Traces a suspicious token (e.g. an ASR-garbled
# name the owner says never existed) to its ORIGIN: does it appear literally in
# the transcript segments (Deepgram mis-transcription the model then faithfully
# repeats) or only in the generated pack (model hallucination)? Also reports the
# current pack's generatedAt so we know whether the owner is looking at an old
# prompt-3 pack or a regenerated prompt-4 one. Prints only the matching segments
# (minimal exposure of private content), never secrets. Opt-in: [aipack].

on:
  workflow_dispatch:
    inputs:
      token:
        description: Token stem to trace (case-insensitive)
        default: nelsad
  push:
    branches: [claude/loquia-milestone-1-frontend-rnoc96]

concurrency:
  group: aipack-diagnose
  cancel-in-progress: false

jobs:
  diag:
    name: Trace token origin
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[aipack]') }}
    env:
      API_HOST: https://api.loquia.com.br
      WWW: https://www.loquia.com.br
      EMAIL: vinicius@apymine.com
      PW: ${{ secrets.ADMIN_PASSWORD }}
      TOKEN: ${{ github.event.inputs.token || 'nelsad' }}
    steps:
      - name: Wait for a healthy API
        run: |
          set -uo pipefail
          for k in $(seq 1 40); do
            c="$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "${API_HOST}/health" || echo 000)"
            echo "  health -> $c (try $k)"; [ "$c" = "200" ] && break; sleep 10
          done

      - name: Trace token across transcript and pack
        run: |
          set -uo pipefail
          PW="${PW:-password123}"
          TK="$(printf '%s' "$TOKEN" | tr '[:upper:]' '[:lower:]')"
          echo "tracing token stem: '${TK}'"
          jar="$(mktemp)"
          lc="$(curl -sS -m 60 -c "$jar" -o /dev/null -w '%{http_code}' -X POST "${API_HOST}/api/auth/login" \
            -H 'content-type: application/json' -H "Origin: ${WWW}" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PW}\"}" || echo 000)"
          echo "login=${lc}"; [ "$lc" = "200" ] || { echo "::error::login failed"; exit 1; }

          curl -sS -m 60 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings?includeArchived=true" -o /tmp/list || true
          echo "== meetings: $(jq 'length' /tmp/list 2>/dev/null) =="
          jq -r '.[] | "\(.id)\t\(.source)\tai=\(.aiPackStatus)\t\(.title)"' /tmp/list 2>/dev/null || head -c 400 /tmp/list

          for MID in $(jq -r '.[].id' /tmp/list 2>/dev/null); do
            TITLE="$(jq -r --arg id "$MID" '.[]|select(.id==$id)|.title' /tmp/list 2>/dev/null)"
            echo ""
            echo "==================== ${TITLE} (${MID}) ===================="

            echo "-- pack generatedAt / provider / model (old prompt-3 vs new prompt-4?) --"
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/ai-pack/status" -o /tmp/s || true
            jq '{status,version,provider,model,generatedAt}' /tmp/s 2>/dev/null || head -c 200 /tmp/s

            echo "-- TRANSCRIPT matches for '${TK}' (origin = ASR if present here) --"
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/transcript" -o /tmp/t || true
            tcount="$(jq --arg tk "$TK" '[(.segments//[])[]|select((.text//""|ascii_downcase)|contains($tk))]|length' /tmp/t 2>/dev/null || echo '?')"
            echo "  transcript segments containing '${TK}': ${tcount}"
            jq -r --arg tk "$TK" '(.segments//[])[]|select((.text//""|ascii_downcase)|contains($tk))|"  [\(.startSeconds|floor)s \(.speakerLabel // .speaker // "?")] \(.text)"' /tmp/t 2>/dev/null | head -20 || true

            echo "-- PACK matches for '${TK}' across text+pt+en+quote (origin = model if here but NOT in transcript) --"
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/aipack" -o /tmp/p || true
            # Synthesized text lives in .pt/.en; verbatim in .text; grounding excerpt in .quote.
            pcount="$(jq --arg tk "$TK" '[(.source.sections//[])[]|.lines[]?|select((((.text//"")+" "+(.pt//"")+" "+(.en//"")+" "+(.quote//""))|ascii_downcase)|contains($tk))]|length' /tmp/p 2>/dev/null || echo '?')"
            echo "  pack lines mentioning '${TK}' (incl. quote): ${pcount}"
            jq -r --arg tk "$TK" '(.source.sections//[])[]|.key as $k|.lines[]?|select((((.text//"")+" "+(.pt//"")+" "+(.en//"")+" "+(.quote//""))|ascii_downcase)|contains($tk))|"  [\($k)] text=\(.text//.pt//.en) | quote=\(.quote//"-")"' /tmp/p 2>/dev/null | head -20 || true

            echo "-- meeting status + transcript size (recording empty-audio check) --"
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}" -o /tmp/m || true
            jq -r '"  source=\(.source) status=\(.status) ai=\(.aiPackStatus) participants=\(.participantCount) dur=\(.durationSeconds)s"' /tmp/m 2>/dev/null || true
            tsegs="$(jq '((.segments//[])|length)' /tmp/t 2>/dev/null || echo '?')"
            echo "  transcript segments=${tsegs}"

            echo "-- ALL processing jobs (trace transcription vs ai_pack; submittedMime/Bytes reveal silent-WAV fallback vs real webm) --"
            curl -sS -m 40 -b "$jar" -H "Origin: ${WWW}" "${API_HOST}/api/meetings/${MID}/jobs" -o /tmp/js || true
            jq -r 'if type=="array" then (.[]|"  [\(.type)] status=\(.status) stage=\(.stage) err=\(.errorCode // "-") mime=\((.metrics.submittedMime) // "-") bytes=\((.metrics.submittedBytes) // "-") words=\((.metrics.wordCount) // "-") msg=\(.errorMessage // "-")") else "  (no jobs endpoint / \(.|tostring[0:80]))" end' /tmp/js 2>/dev/null || echo "  (jobs unavailable)"

            echo "-- pack section sizes (bloat check) --"
            jq -r '(.source.sections // []) | if length==0 then "  <no pack>" else (map("[\(.key)]\((.lines//[])|length)")|join(" ")) end' /tmp/p 2>/dev/null || echo "  (no pack)"

            echo "-- EXECUTIVE SUMMARY --"
            jq -r '[(.source.sections//[])[]|select(.key=="summary")|.lines[]?|(.text//.pt//.en)]|map("  "+.)|join("\n")' /tmp/p 2>/dev/null || true
            echo "-- TOPICS (coherence eyeball) --"
            jq -r '[(.source.sections//[])[]|select(.key=="topics")|.lines[]?|(.text//.pt//.en)]|map("  • "+.)|join("\n")' /tmp/p 2>/dev/null || true
            echo "-- ACTION ITEMS --"
            jq -r '[(.source.sections//[])[]|select(.key=="actionItems")|.lines[]?|(.text//.pt//.en)]|map("  → "+.)|join("\n")' /tmp/p 2>/dev/null || true
            echo "-- EXPLICIT DECISIONS --"
            jq -r '[(.source.sections//[])[]|select(.key=="explicitDecisions")|.lines[]?|(.text//.pt//.en)]|map("  ✓ "+.)|join("\n")' /tmp/p 2>/dev/null || true
          done
