name: Diagnose broken JS chunks (www)

# "Não loga": the browser diagnostic showed the login request never fires because
# _next/static/chunks/*.js abort (net::ERR_ABORTED) — the app never hydrates, so
# the Entrar button does a plain form GET and no login fetch happens. This finds
# out WHY the chunks fail: (1) loquia-web latest deploy status/commit; (2) fetch
# the login HTML from www AND from the onrender host, extract the referenced
# chunk URLs, and check each returns 200 with the right content-type; a mismatch
# (HTML from one build, chunks 404) or www-vs-onrender difference pinpoints it.
# Read-only. Opt-in: dispatch or [corsfix]. Never prints secrets.

on:
  workflow_dispatch:
  push:
    branches: [claude/loquia-milestone-1-frontend-rnoc96]

concurrency:
  group: render-cors-fix
  cancel-in-progress: false

jobs:
  diag:
    name: Diagnose JS chunk loading
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[corsfix]') }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      WWW: https://www.loquia.com.br
    steps:
      - name: loquia-web deploy state + onrender host
        continue-on-error: true
        run: |
          set -uo pipefail
          RENDER_API_KEY="$(printf '%s' "$RENDER_API_KEY" | tr -d '[:space:]')"
          API="https://api.render.com/v1"
          auth=(-H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json")
          svc="$(curl -fsS -m 30 "${auth[@]}" "${API}/services?limit=100" || echo '[]')"
          web_id="$(jq -r '.[].service|select(.name=="loquia-web")|.id' <<<"$svc" | head -n1)"
          onr="$(jq -r '.[].service|select(.name=="loquia-web")|.serviceDetails.url' <<<"$svc" | head -n1)"
          echo "loquia-web id=${web_id}  onrender=${onr}"
          echo "ONRENDER=${onr}" >> "$GITHUB_ENV"
          echo "== last 3 deploys =="
          curl -fsS -m 30 "${auth[@]}" "${API}/services/${web_id}/deploys?limit=3" \
            | jq -r '.[]|.deploy|"  \(.id)  \(.status)  commit=\(.commit.id[0:8])  \(.finishedAt // .createdAt)"' || true

      - name: Compare served HTML + chunk reachability (www vs onrender)
        continue-on-error: true
        run: |
          set -uo pipefail
          check() {
            local base="$1" label="$2"
            echo ""
            echo "================ ${label}: ${base} ================"
            code="$(curl -sS -m 40 -o /tmp/html -w '%{http_code}' "${base}/pt-BR/login" || echo 000)"
            echo "  GET /pt-BR/login -> ${code}  bytes=$(wc -c </tmp/html 2>/dev/null || echo 0)"
            echo "  buildId: $(grep -oE '\"buildId\":\"[^\"]+\"' /tmp/html | head -n1 || echo '(none)')"
            # Extract up to 6 distinct chunk paths referenced by the HTML.
            grep -oE '/_next/static/[^"]+\.js' /tmp/html | sort -u | head -n 6 > /tmp/chunks || true
            n="$(wc -l </tmp/chunks 2>/dev/null || echo 0)"
            echo "  referenced chunks (showing up to 6 of the distinct set): ${n}"
            if [ "$n" = "0" ]; then echo "  !! no chunk references found in HTML"; return; fi
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              cc="$(curl -sS -m 30 -o /dev/null -D /tmp/h -w '%{http_code}' "${base}${path}" || echo 000)"
              ct="$(grep -i '^content-type:' /tmp/h | tr -d '\r' | sed 's/^[Cc]ontent-[Tt]ype: *//' || echo '?')"
              cl="$(grep -i '^content-length:' /tmp/h | tr -d '\r' | sed 's/^[Cc]ontent-[Ll]ength: *//' || echo '?')"
              echo "    ${cc}  ${path}   [${ct}] len=${cl}"
            done < /tmp/chunks
          }
          check "${WWW}" "WWW (custom domain)"
          if [ -n "${ONRENDER:-}" ]; then check "${ONRENDER%/}" "ONRENDER (origin)"; fi

          echo ""
          echo "== Does www HTML reference the SAME buildId as onrender? =="
          curl -sS -m 40 -o /tmp/w "${WWW}/pt-BR/login" || true
          curl -sS -m 40 -o /tmp/o "${ONRENDER%/}/pt-BR/login" || true
          bw="$(grep -oE '\"buildId\":\"[^\"]+\"' /tmp/w | head -n1)"
          bo="$(grep -oE '\"buildId\":\"[^\"]+\"' /tmp/o | head -n1)"
          echo "  www buildId     : ${bw:-?}"
          echo "  onrender buildId: ${bo:-?}"
          [ -n "$bw" ] && [ "$bw" = "$bo" ] && echo "  => SAME build (no stale-HTML mismatch)" || echo "  => DIFFERENT or unknown — possible stale HTML/caching at the domain layer"
