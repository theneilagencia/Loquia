name: Fix CORS + verify browser login

# "Não loga": after pointing the web at api.loquia.com.br, the browser makes a
# cross-origin (same-site) request www -> api. The API only allows origins in
# CORS_ORIGINS/APP_URL. If those still point at the old onrender web URL, the
# browser preflight from https://www.loquia.com.br is rejected and login fails
# (curl succeeds because curl ignores CORS — that's why the earlier check lied).
# This workflow: prints the current CORS/APP_URL, sets CORS_ORIGINS + APP_URL to
# include the custom domains, redeploys loquia-api, then drives a REAL browser
# through www.loquia.com.br/login to confirm. Opt-in: dispatch or [corsfix].
# Never prints secrets (only public origins + status codes).

on:
  workflow_dispatch:
  push:
    branches: [claude/loquia-milestone-1-frontend-rnoc96]

concurrency:
  group: render-cors-fix
  cancel-in-progress: false

jobs:
  fix:
    name: Fix CORS on loquia-api + browser-verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[corsfix]') }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      API_HOST: https://api.loquia.com.br
      WWW: https://www.loquia.com.br
      APEX: https://loquia.com.br
      EMAIL: vinicius@apymine.com
      PW: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Inspect + set CORS_ORIGINS/APP_URL + redeploy loquia-api
        run: |
          set -uo pipefail
          RENDER_API_KEY="$(printf '%s' "$RENDER_API_KEY" | tr -d '[:space:]')"
          API="https://api.render.com/v1"
          auth=(-H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" -H "Content-Type: application/json")

          svc="$(curl -fsS -m 30 "${auth[@]}" "${API}/services?limit=100")"
          api_id="$(jq -r '.[].service|select(.name=="loquia-api")|.id' <<<"$svc" | head -n1)"
          echo "loquia-api id=${api_id}"
          [ -n "$api_id" ] || { echo "::error::loquia-api not found"; exit 1; }

          echo "== Current origin-related env (public values, safe to show) =="
          ev="$(curl -fsS -m 30 "${auth[@]}" "${API}/services/${api_id}/env-vars?limit=100")"
          for K in APP_URL CORS_ORIGINS COOKIE_SAMESITE COOKIE_DOMAIN NODE_ENV; do
            v="$(jq -r --arg k "$K" '.[].envVar|select(.key==$k)|.value' <<<"$ev" | head -n1)"
            echo "  ${K}=${v:-<unset>}"
          done

          # Allowlist: both custom domains (www + apex + api) AND the onrender web
          # host, so login keeps working from every URL the app can be reached at.
          NEWCORS="${WWW},${APEX},${API_HOST},https://loquia-web.onrender.com"
          echo "== Setting CORS_ORIGINS + APP_URL =="
          curl -fsS -X PUT "${auth[@]}" "${API}/services/${api_id}/env-vars/CORS_ORIGINS" \
            -d "$(jq -cn --arg v "$NEWCORS" '{value:$v}')" >/dev/null && echo "  CORS_ORIGINS set -> ${NEWCORS}"
          curl -fsS -X PUT "${auth[@]}" "${API}/services/${api_id}/env-vars/APP_URL" \
            -d "$(jq -cn --arg v "$WWW" '{value:$v}')" >/dev/null && echo "  APP_URL set -> ${WWW}"

          echo "== Redeploy loquia-api =="
          dep="$(curl -fsS -X POST "${auth[@]}" "${API}/services/${api_id}/deploys" -d '{"clearCache":"do_not_clear"}' | jq -r '.id')"
          for i in $(seq 1 60); do
            st="$(curl -fsS "${auth[@]}" "${API}/services/${api_id}/deploys/${dep}" | jq -r '.status')"
            echo "  api deploy ${dep}: ${st}"
            case "$st" in live|deactivated) break;; build_failed|update_failed|canceled) echo "::error::api deploy ${st}"; exit 1;; esac
            sleep 15
          done

          echo "== CORS preflight from ${WWW} (after redeploy) =="
          for i in $(seq 1 8); do
            curl -sS -m 30 -o /dev/null -D /tmp/cors -X OPTIONS "${API_HOST}/api/auth/login" \
              -H "Origin: ${WWW}" -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type' || true
            acao="$(grep -i 'access-control-allow-origin' /tmp/cors | tr -d '\r' || true)"
            echo "  try ${i}: ${acao:-<no ACAO>}"
            [ -n "$acao" ] && break
            sleep 10
          done
          echo "  ACAC: $(grep -i 'access-control-allow-credentials' /tmp/cors | tr -d '\r' || echo '(missing)')"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium
      - name: Real browser login at www.loquia.com.br
        env:
          PW: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          cat > d.cjs <<'EOF'
          (async () => {
            const { chromium } = require('playwright');
            const WEB = 'https://www.loquia.com.br';
            const email = 'vinicius@apymine.com';
            const password = process.env.PW || 'password123';
            const b = await chromium.launch();
            const p = await b.newPage();
            const failed = [], cerr = [];
            let loginStatus = 'none', apiHost = '', acao = '(none)';
            p.on('requestfailed', r => failed.push(r.method()+' '+r.url()+' :: '+((r.failure()||{}).errorText||'')));
            p.on('console', m => { if (m.type()==='error') cerr.push(m.text().slice(0,180)); });
            p.on('response', r => {
              if (r.url().includes('/api/auth/login')) {
                loginStatus = r.status();
                try { apiHost = new URL(r.url()).host; } catch {}
                const h = r.headers(); acao = h['access-control-allow-origin'] || '(none)';
              }
            });
            await p.goto(`${WEB}/pt-BR/login`, { waitUntil: 'domcontentloaded', timeout: 60000 }).catch(e=>console.log('goto err:', e.message));
            await p.getByLabel('E-mail').fill(email).catch(()=>{});
            await p.getByLabel('Senha', { exact: true }).fill(password).catch(()=>{});
            await p.getByRole('button', { name: 'Entrar' }).click().catch(()=>{});
            await p.waitForTimeout(7000);
            const urlAfter = p.url();
            await p.goto(`${WEB}/pt-BR/app`, { waitUntil: 'domcontentloaded', timeout: 60000 }).catch(()=>{});
            await p.waitForTimeout(3000);
            const urlReload = p.url();
            await p.screenshot({ path: 'cors-login.png', fullPage: true }).catch(()=>{});
            console.log('login API host  :', apiHost || '(request never fired)');
            console.log('login API status:', loginStatus);
            console.log('login ACAO      :', acao);
            console.log('URL after submit:', urlAfter);
            console.log('URL after /app  :', urlReload);
            const ok = /\/pt-BR\/app(\b|\/|\?|$)/.test(urlReload) && !/\/login/.test(urlReload);
            console.log(ok ? 'RESULT: LOGIN OK — session persists in a real browser.'
                           : 'RESULT: LOGIN FAILED — still bounced to /login.');
            if (failed.length) console.log('FAILED reqs:\n  ' + failed.slice(0,10).join('\n  '));
            if (cerr.length) console.log('CONSOLE err:\n  ' + cerr.slice(0,10).join('\n  '));
            await b.close();
          })().catch(e => { console.error(e.message); process.exit(1); });
          EOF
          node d.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cors-login-screenshot
          path: cors-login.png
          if-no-files-found: ignore
