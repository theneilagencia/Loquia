name: CI & Live Verify

# Milestone 5.3. GitHub-hosted runners are not behind the dev sandbox egress
# policy, so this is the autonomous route to run the full gate suite on clean
# infra and (opt-in, manual) the live provider smokes. Secrets are read from
# GitHub Secrets and never printed. Nothing here reintroduces object storage.

on:
  push:
    branches: [main, claude/loquia-milestone-1-frontend-rnoc96]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run live provider smokes (needs provider secrets)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (credential-independent)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/loquia
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/loquia_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/loquia_e2e
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379
      E2E_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create databases
        run: |
          for db in loquia loquia_test loquia_e2e; do
            PGPASSWORD=postgres psql -h localhost -U postgres -tc \
              "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1 || \
            PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ${db}"
          done
      - name: Apply migrations
        run: |
          for url in "$DATABASE_URL" "$TEST_DATABASE_URL" "$E2E_DATABASE_URL"; do
            DATABASE_URL="$url" pnpm --filter @loquia/api exec tsx src/db/migrate.ts
          done
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present test
      - name: Install Playwright Chromium
        run: pnpm --filter @loquia/web exec playwright install --with-deps chromium
      - name: e2e (mock mode)
        run: pnpm --filter @loquia/web test:e2e
      - run: pnpm --filter @loquia/web build
      - run: pnpm --filter @loquia/web build-storybook
      - name: Production smoke (infra; providers NOT RUN without keys)
        run: pnpm --filter @loquia/api smoke:production

  live-verify:
    name: Live provider verification (opt-in)
    runs-on: ubuntu-latest
    needs: gates
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
    env:
      # Provider keys come from GitHub Secrets; the smokes self-report NOT RUN
      # when a key is absent, so this job never fails for a missing credential.
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_PACK_MODEL: ${{ secrets.AI_PACK_MODEL }}
      EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SMOKE_EMAIL_TO: ${{ secrets.SMOKE_EMAIL_TO }}
      APP_URL: ${{ secrets.APP_URL }}
      PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provider capability smoke (Deepgram submit + Anthropic generate)
        run: pnpm --filter @loquia/pipeline smoke
