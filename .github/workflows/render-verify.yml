name: Verify Render deployment

# Fast, READ-ONLY check of the live Render deployment: discover the loquia-api URL
# via the Render API, then poll /health and /ready with a short bound. Sets no env
# vars and triggers no deploys. Opt-in: manual dispatch or a [verify] commit marker.

on:
  workflow_dispatch:
  push:
    branches: [claude/loquia-milestone-1-frontend-rnoc96]

concurrency:
  group: render-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verify live API
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify]') }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      API_NAME: loquia-api
      WEB_NAME: loquia-web
    steps:
      - name: Discover URLs and check health
        run: |
          set -euo pipefail
          RENDER_API_KEY="$(printf '%s' "${RENDER_API_KEY:-}" | tr -d '[:space:]')"
          [ -n "$RENDER_API_KEY" ] || { echo "::error::RENDER_API_KEY not set"; exit 1; }
          API="https://api.render.com/v1"
          auth=(-H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json")
          resp="$(curl -sS -m 30 -w $'\n%{http_code}' "${auth[@]}" "${API}/services?limit=100")"
          code="${resp##*$'\n'}"; body="${resp%$'\n'*}"
          [ "$code" = "200" ] || { echo "::error::GET /services HTTP $code"; printf '%s' "$body" | head -c 300; exit 1; }
          api_url="$(jq -r --arg n "$API_NAME" '.[].service | select(.name==$n) | .serviceDetails.url // empty' <<<"$body" | head -n1)"
          web_url="$(jq -r --arg n "$WEB_NAME" '.[].service | select(.name==$n) | .serviceDetails.url // empty' <<<"$body" | head -n1)"
          # Report each service's latest deploy status + failure reason (the key signal).
          echo "== Latest deploy status per service =="
          for n in "$API_NAME" "$WEB_NAME"; do
            sid="$(jq -r --arg n "$n" '.[].service | select(.name==$n) | .id' <<<"$body" | head -n1)"
            dep="$(curl -sS -m 20 "${auth[@]}" "${API}/services/${sid}/deploys?limit=1")"
            st="$(jq -r '.[0].deploy.status // .[0].status // "unknown"' <<<"$dep")"
            echo "  ${n}: id=${sid} latest_deploy=${st}"
          done
          echo "API_URL=${api_url:-MISSING}"
          echo "WEB_URL=${web_url:-MISSING}"
          [ -n "$api_url" ] || { echo "::error::api url not found"; jq '.[0]' <<<"$body"; exit 1; }

          # Fail-fast probe: short per-attempt timeout so a non-responding endpoint
          # doesn't hang the job. ~72s max per endpoint.
          probe () { # $1=url -> returns 0 on 200
            for i in $(seq 1 6); do
              code="$(curl -sS -o /tmp/b -m 12 -w '%{http_code}' "$1" 2>/dev/null || echo 000)"
              echo "  GET $1 -> ${code}"
              if [ "$code" = "200" ]; then echo "  body: $(head -c 300 /tmp/b)"; return 0; fi
              sleep 8
            done
            return 1
          }
          rc=0
          echo "== /health (cold start may take ~50s) =="; probe "${api_url}/health" || { echo "::error::/health not 200 — API not live (see deploy status above; check Render deploy log)"; rc=1; }
          echo "== /ready =="; probe "${api_url}/ready" || echo "::warning::/ready not 200"
          echo "== web root =="; probe "${web_url}/pt-BR" || echo "::warning::web not 200 yet"

          echo "== web CSS assets =="
          html="$(curl -sS -m 20 "${web_url}/pt-BR" || true)"
          # Extract stylesheet + preloaded CSS hrefs referenced by the served HTML.
          mapfile -t css < <(grep -oE '/_next/static/[^"]+\.css' <<<"$html" | sort -u)
          echo "stylesheet links in HTML: ${#css[@]}"
          if [ "${#css[@]}" -eq 0 ]; then
            echo "::warning::no CSS <link> found in served HTML — dumping <head>"; grep -oE '<head>.*</head>' <<<"$html" | head -c 1500; echo
          fi
          for href in "${css[@]}"; do
            cc="$(curl -sS -m 15 -o /tmp/css -w '%{http_code}:%{content_type}' "${web_url}${href}" 2>/dev/null || echo '000:')"
            echo "  ${href} -> ${cc} ($(wc -c </tmp/css 2>/dev/null) bytes)"
          done
          exit $rc
