# Loquia — Render Blueprint (Milestone 5.2 pipeline; free-plan topology).
# Structurally validated only; no deploy is performed here (no real credentials in
# this environment). Secrets are never committed — they are injected by Render
# (generateValue / sync:false / fromDatabase). Deepgram, Anthropic and Resend
# credentials are set in the Render dashboard (sync:false); production never
# silently uses mocks/console. There is NO object storage / R2.
#
# FREE-PLAN TOPOLOGY: Render background workers are a PAID instance type, so this
# blueprint has NO separate worker and NO Redis/Key Value. The API generates the
# AI Pack in-process (it drains ai_pack jobs from Postgres itself; the Deepgram
# callback that inserts the job also wakes the service). Trade-offs to accept on
# free: web services SPIN DOWN after ~15 min idle (≈1 min cold start — Deepgram
# retries its callback, so it still lands), and the free Postgres is small and
# EXPIRES (~30 days) — export anything you need to keep. To scale later, upgrade
# the plans, add a Key Value + a `worker` service, and set REDIS_URL on the API:
# the same job code then runs in a dedicated worker via BullMQ instead of in-process.
#
# Region: pin both web services and the database to the SAME region (e.g. `oregon`)
# so the API↔DB hops stay in-region. Set it per service with a `region:` key
# (omitted here so the blueprint stays account-default; apply one region uniformly).

databases:
  - name: loquia-postgres
    databaseName: loquia
    user: loquia
    plan: free # free Postgres expires (~30 days); upgrade to a paid plan to persist

services:
  # ---- API (Fastify) — ingests + transcribes audio AND generates the AI Pack
  #      in-process (free plan: no separate worker, no Redis) ----
  - type: web
    name: loquia-api
    runtime: node
    plan: free
    rootDir: .
    # Don't rebuild the service for docs/CI-only commits (avoids needless free-tier
    # redeploys + downtime windows). Only code changes trigger a build.
    buildFilter:
      ignoredPaths:
        - docs/**
        - .github/**
        - "**/*.md"
    # `--prod=false`: NODE_ENV=production is set on the service, and pnpm then
    # skips devDependencies — so force a full install for the build/runtime tooling.
    buildCommand: npm install -g pnpm@10.33.0 && pnpm install --frozen-lockfile --prod=false
    # Free tier does NOT support preDeployCommand, so run migrations at startup.
    # Drizzle tracks applied migrations, so re-running on each (cold) start is an
    # idempotent no-op once the schema is current. bootstrap-admin then creates
    # the first owner ONLY when the users table is empty (no-op afterwards), so
    # the admin login works on a fresh production database.
    startCommand: pnpm --filter @loquia/api db:migrate && pnpm --filter @loquia/api db:bootstrap-admin && pnpm --filter @loquia/api start
    # Readiness gate: /ready verifies the DB (hard). Liveness is /health.
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: loquia-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # First-admin bootstrap (used only when the users table is empty). Set
      # ADMIN_PASSWORD to a strong secret; ADMIN_EMAIL/NAME/LOCALE are optional.
      # If ADMIN_PASSWORD is unset the bootstrap falls back to a default and logs
      # a warning — change it immediately after first login.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false # set to the loquia-web public URL
      - key: PUBLIC_API_URL
        sync: false # set to the loquia-api public URL
      - key: CORS_ORIGINS
        sync: false # comma-separated allowlist; defaults to APP_URL
      # No REDIS_URL on free: without it the API runs the AI Pack in-process. Set
      # REDIS_URL (+ add a Key Value and a worker service) only to scale out later.
      # --- Transcription (real; no silent mock fallback in prod). The API submits
      #     the received audio bytes directly to Deepgram — no object storage. ---
      - key: TRANSCRIPTION_PROVIDER
        value: deepgram
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_MODEL
        value: nova-2
      # Authenticates Deepgram's async callback to /api/webhooks/deepgram.
      - key: DEEPGRAM_CALLBACK_SECRET
        generateValue: true
      # Direct-ingest tuning.
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "524288000"
      # --- AI Pack generation (real; runs on the worker) ---
      - key: AI_PACK_PROVIDER
        value: anthropic
      - key: AI_PACK_MODEL
        value: claude-sonnet-5
      - key: AI_PACK_MAX_RETRIES
        value: "2"
      - key: ANTHROPIC_API_KEY
        sync: false
      # --- Transactional email (real; console is dev/test only) ---
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false # Resend API key
      - key: EMAIL_FROM
        sync: false # e.g. "Loquia <no-reply@yourdomain.com>" (verified sender)
      - key: EMAIL_REPLY_TO
        sync: false # optional
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "60"
      # --- Operational quotas (protection, not billing) ---
      - key: MAX_MEETING_DURATION_SECONDS
        value: "14400"
      - key: MAX_ACTIVE_PROCESSING_JOBS_PER_WORKSPACE
        value: "20"
      - key: MAX_AI_PACK_REGENERATIONS_PER_HOUR
        value: "10"

  # ---- Web (Next.js), talking to the API ----
  - type: web
    name: loquia-web
    runtime: node
    plan: free
    rootDir: .
    buildFilter:
      ignoredPaths:
        - docs/**
        - .github/**
        - "**/*.md"
    # `--prod=false`: install devDependencies for `next build` despite NODE_ENV=production.
    buildCommand: npm install -g pnpm@10.33.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @loquia/web build
    startCommand: pnpm --filter @loquia/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_MODE
        value: api
      - key: NEXT_PUBLIC_API_URL
        sync: false # set to the loquia-api public URL

  # NOTE: no `worker` and no `keyvalue` service on the free plan. Render workers
  # are paid; the API generates the AI Pack in-process (see the header). The AI
  # Pack env vars (AI_PACK_PROVIDER/MODEL/MAX_RETRIES + ANTHROPIC_API_KEY) live on
  # loquia-api above. To scale out later, add a Key Value + a `worker` service and
  # set REDIS_URL on both — the same job code then runs via BullMQ.
