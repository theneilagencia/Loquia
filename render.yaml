# Loquia — Render Blueprint (Milestone 4: media pipeline + AI Pack generation).
# Structurally validated only; no deploy is performed in this milestone.
# Secrets are never committed — they are injected by Render (generateValue /
# sync:false / fromDatabase / fromService). R2 and Deepgram credentials are set
# in the Render dashboard (sync:false); production never silently uses mocks.

databases:
  - name: loquia-postgres
    databaseName: loquia
    user: loquia
    plan: basic-256mb

services:
  # ---- API (Fastify) ----
  - type: web
    name: loquia-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    preDeployCommand: pnpm --filter @loquia/api db:migrate
    startCommand: pnpm --filter @loquia/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: loquia-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # set to the loquia-web public URL
      - key: PUBLIC_API_URL
        sync: false # set to the loquia-api public URL (used for storage callbacks)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: loquia-queue
          property: connectionString
      # --- Media pipeline providers (real; no silent mock fallback in prod) ---
      - key: STORAGE_PROVIDER
        value: r2
      - key: TRANSCRIPTION_PROVIDER
        value: deepgram
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_MODEL
        value: nova-2
      # --- AI Pack generation (real; no silent mock fallback in prod) ---
      - key: AI_PACK_PROVIDER
        value: anthropic
      - key: AI_PACK_MODEL
        value: claude-sonnet-5
      - key: AI_PACK_MAX_RETRIES
        value: "2"
      - key: ANTHROPIC_API_KEY
        sync: false

  # ---- Web (Next.js), talking to the API ----
  - type: web
    name: loquia-web
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @loquia/web build
    startCommand: pnpm --filter @loquia/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_MODE
        value: api
      - key: NEXT_PUBLIC_API_URL
        sync: false # set to the loquia-api public URL

  # ---- Worker (BullMQ consumer: STT + diarization → transcript segments) ----
  - type: worker
    name: loquia-worker
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @loquia/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: loquia-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: loquia-queue
          property: connectionString
      - key: PUBLIC_API_URL
        sync: false # set to the loquia-api public URL
      # --- Media pipeline providers (must match the API service) ---
      - key: STORAGE_PROVIDER
        value: r2
      - key: TRANSCRIPTION_PROVIDER
        value: deepgram
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_MODEL
        value: nova-2
      # --- AI Pack generation (real; no silent mock fallback in prod) ---
      - key: AI_PACK_PROVIDER
        value: anthropic
      - key: AI_PACK_MODEL
        value: claude-sonnet-5
      - key: AI_PACK_MAX_RETRIES
        value: "2"
      - key: ANTHROPIC_API_KEY
        sync: false

  # ---- Key Value (Redis-compatible) backing the BullMQ queue ----
  - type: keyvalue
    name: loquia-queue
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only reachable from Render services
