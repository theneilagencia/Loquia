# Loquia — Render Blueprint (Milestone 5.2: direct processing, no object storage).
# Structurally validated only; no deploy is performed here (no real credentials in
# this environment). Secrets are never committed — they are injected by Render
# (generateValue / sync:false / fromDatabase / fromService). Deepgram, Anthropic
# and Resend credentials are set in the Render dashboard (sync:false); production
# never silently uses mocks/console. There is NO object storage / R2.
#
# Region: pin every service and the database to the SAME region (e.g. `oregon`) so
# the API↔DB↔queue↔worker hops stay in-region. Set it per service with a `region:`
# key (omitted here so the blueprint stays account-default; choose one region and
# apply it uniformly before the first deploy).

databases:
  - name: loquia-postgres
    databaseName: loquia
    user: loquia
    plan: basic-256mb

services:
  # ---- API (Fastify) — also ingests + transcribes audio (M5.2) ----
  - type: web
    name: loquia-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    preDeployCommand: pnpm --filter @loquia/api db:migrate
    startCommand: pnpm --filter @loquia/api start
    # Readiness gate: /ready verifies the DB (hard) and reports the queue.
    # Liveness is /health (no dependencies) for uptime probes.
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: loquia-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # set to the loquia-web public URL
      - key: PUBLIC_API_URL
        sync: false # set to the loquia-api public URL
      - key: CORS_ORIGINS
        sync: false # comma-separated allowlist; defaults to APP_URL
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: loquia-queue
          property: connectionString
      # --- Transcription (real; no silent mock fallback in prod). The API submits
      #     the received audio bytes directly to Deepgram — no object storage. ---
      - key: TRANSCRIPTION_PROVIDER
        value: deepgram
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_MODEL
        value: nova-2
      # Authenticates Deepgram's async callback to /api/webhooks/deepgram.
      - key: DEEPGRAM_CALLBACK_SECRET
        generateValue: true
      # Direct-ingest tuning.
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "524288000"
      # --- AI Pack generation (real; runs on the worker) ---
      - key: AI_PACK_PROVIDER
        value: anthropic
      - key: AI_PACK_MODEL
        value: claude-sonnet-5
      - key: AI_PACK_MAX_RETRIES
        value: "2"
      - key: ANTHROPIC_API_KEY
        sync: false
      # --- Transactional email (real; console is dev/test only) ---
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false # Resend API key
      - key: EMAIL_FROM
        sync: false # e.g. "Loquia <no-reply@yourdomain.com>" (verified sender)
      - key: EMAIL_REPLY_TO
        sync: false # optional
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "60"
      # --- Operational quotas (protection, not billing) ---
      - key: MAX_MEETING_DURATION_SECONDS
        value: "14400"
      - key: MAX_ACTIVE_PROCESSING_JOBS_PER_WORKSPACE
        value: "20"
      - key: MAX_AI_PACK_REGENERATIONS_PER_HOUR
        value: "10"

  # ---- Web (Next.js), talking to the API ----
  - type: web
    name: loquia-web
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @loquia/web build
    startCommand: pnpm --filter @loquia/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_MODE
        value: api
      - key: NEXT_PUBLIC_API_URL
        sync: false # set to the loquia-api public URL

  # ---- Worker (BullMQ consumer): AI Pack generation ONLY (M5.2) ----
  # Transcription now happens inline in the API ingest, so the worker no longer
  # needs storage or a transcription provider — only Anthropic for the AI Pack.
  - type: worker
    name: loquia-worker
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @loquia/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: loquia-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: loquia-queue
          property: connectionString
      - key: AI_PACK_PROVIDER
        value: anthropic
      - key: AI_PACK_MODEL
        value: claude-sonnet-5
      - key: AI_PACK_MAX_RETRIES
        value: "2"
      - key: ANTHROPIC_API_KEY
        sync: false

  # ---- Key Value (Redis-compatible) backing the BullMQ queue (AI Pack jobs) ----
  - type: keyvalue
    name: loquia-queue
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only reachable from Render services
